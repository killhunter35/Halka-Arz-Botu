<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kestirme Tetikleyici</title>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const firma = params.get('firma');
            const tarih = params.get('tarih');

            if (firma && tarih) {
                // Verileri JSON'a çevirip Apple'ın anlayacağı dile kodluyoruz
                const dict = { firma: firma, tarih: tarih };
                const encoded = encodeURIComponent(JSON.stringify(dict));
                // Kestirmeyi tetikliyoruz!
                window.location.href = "shortcuts://run-shortcut?name=ArzEkle&input=" + encoded;
            } else {
                document.write("Hatalı veya eksik link.");
            }
        }
    </script>
</head>
<body style="background-color:#1e1e1e; color:white; font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>Kestirme Tetikleniyor...</h2>
    <p>Safari size "Kestirmeler'de açılsın mı?" diye sorarsa İzin Ver'e tıklayın.</p>
</body>
</html>

name: Halka Arz Botu Otomasyonu

on:
  schedule:
    # Türkiye saatiyle sabah 08:00 (UTC 05:00)
    - cron: '0 5 * * *'
  workflow_dispatch: # İstediğin zaman manuel test edebilmen için buton ekler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python'u Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır
      env:
        MAIL_ADRESI: ${{ secrets.MAIL_ADRESI }}
        MAIL_SIFRESI: ${{ secrets.MAIL_SIFRESI }}
      run: python Halka-Arz-Tespit.py

    - name: Güncel Excel'i GitHub'a Kaydet
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add Halka_Arz_Verileri.xlsx
        git commit -m "Günlük Excel Güncellemesi" || echo "Değişiklik yok"
        git push
